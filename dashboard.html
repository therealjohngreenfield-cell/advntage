<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advntage — Client Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --blue:#3B6FF0;--blue-light:#5B8BFF;
  --black:#060608;--dark:#0C0D10;--card:#111318;
  --border:rgba(255,255,255,0.07);
  --white:#F0F0F8;--gray:#6B6B80;--light:#A0A0BC;
  --green:#22D07A;--red:#F05050;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);color:var(--white);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}

/* Background glow */
.bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;}
.bg-glow::before{content:'';position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(59,111,240,0.07) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-60%);}
.bg-glow::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(34,208,122,0.04) 0%,transparent 70%);bottom:10%;right:10%;}

.wrap{position:relative;z-index:1;width:100%;max-width:440px;padding:0 24px;}

/* Logo */
.logo{text-align:center;margin-bottom:48px;}
.logo .ad{font-family:'Syne',sans-serif;font-size:3rem;font-weight:800;color:var(--blue);letter-spacing:-0.04em;}
.logo .rest{font-family:'Syne',sans-serif;font-size:3rem;font-weight:800;color:var(--white);letter-spacing:-0.04em;}
.logo .tagline{display:block;font-size:0.7rem;color:var(--gray);letter-spacing:0.18em;text-transform:uppercase;margin-top:8px;}

/* Card */
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px 36px;}
.card-title{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:700;margin-bottom:6px;}
.card-sub{color:var(--gray);font-size:0.85rem;margin-bottom:32px;line-height:1.6;}

/* Fields */
.field{margin-bottom:16px;}
.field label{display:block;font-size:0.72rem;color:var(--gray);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px;font-weight:600;}
.field input{width:100%;background:var(--black);border:1px solid var(--border);border-radius:10px;padding:13px 16px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none;transition:border-color 0.2s;}
.field input:focus{border-color:rgba(59,111,240,0.5);}
.field input::placeholder{color:var(--gray);}

/* Button */
.btn{width:100%;background:var(--blue);color:white;border:none;border-radius:10px;padding:14px;font-family:'DM Sans',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;margin-top:8px;transition:all 0.2s;letter-spacing:0.01em;}
.btn:hover{background:var(--blue-light);transform:translateY(-1px);box-shadow:0 8px 24px rgba(59,111,240,0.3);}
.btn:active{transform:translateY(0);}

/* Error */
.error{color:var(--red);font-size:0.8rem;margin-top:12px;text-align:center;display:none;padding:10px;background:rgba(240,80,80,0.08);border-radius:8px;border:1px solid rgba(240,80,80,0.15);}

/* Footer */
.footer{margin-top:32px;text-align:center;font-size:0.72rem;color:var(--gray);}
.footer a{color:var(--blue-light);text-decoration:none;}
.footer a:hover{text-decoration:underline;}

/* Client hint chips */
.hint{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
.hint-chip{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:100px;padding:4px 12px;font-size:0.72rem;color:var(--gray);}
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="wrap">
  <div class="logo">
    <span class="ad">Ad</span><span class="rest">vntage</span>
    <span class="tagline">Client Portal</span>
  </div>

  <div class="card">
    <div class="card-title">Sign in to your dashboard</div>
    <div class="card-sub">Access your live campaign performance, spend data, and optimization history.</div>

    <div class="field">
      <label>Account</label>
      <input type="text" id="u" placeholder="e.g. johns-tree" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="p" placeholder="••••••••">
    </div>

    <button class="btn" id="login-btn">Access Dashboard →</button>
    <div class="error" id="err">Incorrect credentials. Please try again.</div>
  </div>

  <div class="hint">
    <span class="hint-chip">🌳 John's Tree Service</span>
    <span class="hint-chip">🚛 Reliable Movers</span>
  </div>

  <div class="footer">
    Managed by <a href="https://advntage.com">Advntage</a> Paid Media Agency
  </div>
</div>

<script>
// Client credentials → dashboard file mapping
const CLIENTS = {
  'johns-tree':     { pass:'tree2024',   file:'johns-tree-dashboard-v4.html' },
  'reliable-movers':{ pass:'movers2024', file:'reliable-movers-dashboard-v2.html' }
};

function login() {
  const u = document.getElementById('u').value.trim().toLowerCase();
  const p = document.getElementById('p').value;
  const err = document.getElementById('err');

  const client = CLIENTS[u];
  if (client && client.pass === p) {
    err.style.display = 'none';
    window.location.href = client.file;
  } else {
    err.style.display = 'block';
    document.getElementById('p').value = '';
    document.getElementById('p').focus();
  }
}

document.getElementById('login-btn').addEventListener('click', login);
document.getElementById('p').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') login();
});
document.getElementById('u').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('p').focus();
});
</script>
</body>
</html>
